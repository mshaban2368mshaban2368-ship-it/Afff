name: Build Debug APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-apk:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify active Java version
        run: java -version

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Verify active Gradle version
        run: gradle --version

      - name: Create temporary debug keystore
        run: |
          rm -f debug.keystore
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        id: build_apk
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Remove temporary debug keystore
        if: always()
        run: rm -f debug.keystore

      - name: Verify debug APK exists
        run: |
          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "::error::Expected APK not found at app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare release metadata and APK asset
        id: release_meta
        run: |
          RELEASE_TAG="apk-r${GITHUB_RUN_NUMBER}-a${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="FA97 Debug APK (Run #${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT})"
          ASSET_FILENAME="fa97-debug-r${GITHUB_RUN_NUMBER}-a${GITHUB_RUN_ATTEMPT}.apk"
          STAGED_APK="${RUNNER_TEMP}/${ASSET_FILENAME}"

          cp app/build/outputs/apk/debug/app-debug.apk "$STAGED_APK"

          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"
          echo "asset_filename=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "staged_apk=${STAGED_APK}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release with APK
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release_meta.outputs.title }}
          STAGED_APK: ${{ steps.release_meta.outputs.staged_apk }}
        run: |
          gh release create "$RELEASE_TAG" "$STAGED_APK" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "Automated debug APK build for commit \`${GITHUB_SHA}\` (run \`${GITHUB_RUN_NUMBER}\`, attempt \`${GITHUB_RUN_ATTEMPT}\`)." \
            --latest

      - name: Report APK download result
        if: always() && steps.upload_artifact.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release_meta.outputs.title }}
          ASSET_FILENAME: ${{ steps.release_meta.outputs.asset_filename }}
        run: |
          if [ "$RELEASE_OUTCOME" = "success" ]; then
            gh release view "$RELEASE_TAG"
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url --jq '.url')
            CONFIRMED_ASSET=$(gh release view "$RELEASE_TAG" --json assets --jq --arg name "$ASSET_FILENAME" '.assets[] | select(.name == $name) | .name')
            FINAL_ASSET="${CONFIRMED_ASSET:-$ASSET_FILENAME}"

            echo "Release tag: $RELEASE_TAG"
            echo "Release title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "APK asset filename: $FINAL_ASSET"

            {
              echo "## APK Build & Release Result"
              echo ""
              echo "- **APK build:** Succeeded (\`app/build/outputs/apk/debug/app-debug.apk\`)"
              echo "- **Actions artifact:** \`app-debug-apk\` uploaded (available as a backup)"
              echo "- **Release status:** Published (latest)"
              echo "- **Release tag:** \`$RELEASE_TAG\`"
              echo "- **Release title:** $RELEASE_TITLE"
              echo "- **Release URL:** $RELEASE_URL"
              echo "- **APK asset:** \`$FINAL_ASSET\`"
              echo ""
              echo "The APK can be downloaded directly from the **Assets** section on the GitHub Release page above. The normal Actions artifact (\`app-debug-apk\`) is also available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed. The APK build succeeded and the Actions artifact 'app-debug-apk' remains available."
            echo "APK build succeeded."
            echo "Actions artifact 'app-debug-apk' remains available."

            {
              echo "## APK Build & Release Result"
              echo ""
              echo "> **Warning:** GitHub Release publishing failed."
              echo ""
              echo "- **APK build:** Succeeded (\`app/build/outputs/apk/debug/app-debug.apk\`)"
              echo "- **Actions artifact:** \`app-debug-apk\` remains available for download as a backup."
              echo ""
              echo "Download the debug APK from the **Artifacts** section (\`app-debug-apk\`) of this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
